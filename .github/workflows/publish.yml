name: Update code snippets and publish the extension

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Run script and update snippets
        run: |
          mkdir -p snippets
          python update_snippets.py > snippets/licenses.json

      - name: Check for changes in snippets
        id: verify_changes
        run: |
          # Check if code snippets have changed
          if git diff --quiet snippets/licenses.json; then
            echo "changes_detected=false" >> $GITHUB_OUTPUT
            echo "✅️ Code snippets are up to date." >> $GITHUB_STEP_SUMMARY
          else
            echo "changes_detected=true" >> $GITHUB_OUTPUT
            echo "🔁 Detected code snippets change. Updating the extension..." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Set up Node.js
        if: steps.verify_changes.outputs.changes_detected == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install VSCE globally
        if: steps.verify_changes.outputs.changes_detected == 'true'
        run: npm install -g @vscode/vsce@4

      - name: Configure Git
        if: steps.verify_changes.outputs.changes_detected == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit updated code snippets
        run: |
          git add snippets/licenses.json
          git commit -m "chore: update code snippets"

      - name: Bump version and push changes
        if: steps.verify_changes.outputs.changes_detected == 'true'
        id: version_bump
        run: |
          # Bump patch version
          npm version patch -m "chore: bump version to %s"

          # Get new version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "version=v$NEW_VERSION" >> $GITHUB_OUTPUT

          # Push tagged changes
          git push origin main --follow-tags

      - name: Build VSIX Package
        if: steps.verify_changes.outputs.changes_detected == 'true'
        run: vsce package

      - name: Publish to VS Code Marketplace
        if: steps.verify_changes.outputs.changes_detected == 'true'
        run: vsce publish --oidc --no-dependencies

      - name: Create GitHub Release
        if: steps.verify_changes.outputs.changes_detected == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_bump.outputs.version }}
          name: Release ${{ steps.version_bump.outputs.version }}
          body: "Update code snippets to match the latest license info provided by GitHub API."
          files: |
            *.vsix
            snippets/licenses.json
          draft: false
          prerelease: false
